[package]
name = "xp-enhance"
version = "0.6.0"
description = "Local-first flight environment workspace for X-Plane 12"
authors = ["APGSwizzVR"]
edition = "2021"

[lib]
name = "xp_enhance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
semver = "1"
sysinfo = "0.33"
