name: Build XP Enhance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows application
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore XPEnhance.csproj

      - name: Build
        run: dotnet build XPEnhance.csproj --configuration Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish XPEnhance.csproj --configuration Release --no-restore --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: XP-Enhance-Windows-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30
