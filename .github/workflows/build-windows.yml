name: Build XP Enhance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows desktop app
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Read application version
        id: app_version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Tauri application
        run: npm run tauri -- build --bundles nsis

      - name: Publish Windows installer
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: XP Enhance v${{ steps.app_version.outputs.version }}
          body: "Stable Windows x64 installer for XP Enhance v${{ steps.app_version.outputs.version }}. Commit: ${{ github.sha }}."
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
          prerelease: false
          make_latest: true
