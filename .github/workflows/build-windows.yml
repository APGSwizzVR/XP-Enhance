name: Build XP Enhance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows application
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Windows x64 dependencies
        run: dotnet restore XPEnhance.csproj --runtime win-x64

      - name: Build
        run: dotnet build XPEnhance.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Publish Windows x64
        run: dotnet publish XPEnhance.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish

      - name: Publish downloadable GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: XP Enhance build ${{ github.run_number }}
          body: Automated Windows x64 build from commit ${{ github.sha }}.
          files: publish/*
          prerelease: true
          make_latest: false
